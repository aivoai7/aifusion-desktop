<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIFusion</title>
    <script>(function(){try{var k="aifusion-theme",v=localStorage.getItem(k);if(v==null){v=localStorage.getItem("cc-switch-theme");if(v!=null)localStorage.setItem(k,v);}var t=v||"system";var d=t==="dark"||(t==="system"&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.classList.toggle("dark",d);}catch(e){}})()</script>
  </head>
  <body class="tray-panel">
    <div id="root"></div>
    <script type="module" src="./tray-panel/main.tsx"></script>
  </body>
</html>
